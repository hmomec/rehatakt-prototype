<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700&display=swap">
<style>
  :root {
    --outer: #DCE4DD;
    --ground: #F4F6F3; --surface: #FFFFFF; --surface-2: #F8FAF8;
    --ink: #0E2A1D; --ink-2: #17402C;

    --ok: #1B6B42; --ok-bg: #E9F3ED;
    --warn: #8A4B11; --warn-bg: #FCF0E2;

      --line: #24372D; --line-soft: #1D2F26;
      --primary: #2FB871; --primary-strong: #3FCB80; --primary-tint: #14301F; --on-primary: #05170E;
      --ok: #6EDFA3; --ok-bg: #14301F;
      --warn: #E8B476; --warn-bg: #31240F;
      --crit: #F0A091; --crit-bg: #381A14;
      --info: #96C6E0; --info-bg: #132737;
      --sel: #2FB871; --on-sel: #05170E; --sel-soft: #07331D; --sel-dot: #05170E;
      --control: #6F877A;
    }
  }
  :root[data-theme="dark"] {
    --outer: #050C08;
    --ground: #0A1610; --surface: #13211B; --surface-2: #17281F;
    --ink: #123524; --ink-2: #13211B;
    --text: #E9F1EB; --muted: #9EB4A7; --faint: #7F9789;
    --line: #24372D; --line-soft: #1D2F26;
    --primary: #2FB871; --primary-strong: #3FCB80; --primary-tint: #14301F; --on-primary: #05170E;
    --ok: #6EDFA3; --ok-bg: #14301F;
    --warn: #E8B476; --warn-bg: #31240F;
    --crit: #F0A091; --crit-bg: #381A14;

  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--outer); color: var(--text); font-family: 'Manrope', system-ui, sans-serif; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; display: flex; justify-content: center; }
  h1, h2, h3 { font-family: 'Sora', 'Manrope', sans-serif; margin: 0; letter-spacing: -.4px; }
  button { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--primary-strong); outline-offset: 2px; border-radius: 10px; }

  .phone { width: 100%; max-width: 430px; height: 100%; background: var(--ground); display: flex; flex-direction: column; position: relative; overflow: hidden; }
  @media (min-width: 640px) {
    body { align-items: center; padding-block: 24px; }
    .phone { height: min(880px, 100%); border-radius: 32px; border: 1px solid var(--line); box-shadow: 0 30px 80px -30px rgba(8,20,14,.45); }
  }

  .appbar { flex-shrink: 0; padding: 14px 18px 12px; display: flex; align-items: center; gap: 10px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .mark { width: 32px; height: 32px; border-radius: 10px; background: var(--ink); display: grid; place-items: center; flex-shrink: 0; }
  .wordmark { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: -.3px; }
  .wordmark em { font-style: normal; color: var(--primary-strong); }
  .net { margin-left: auto; border: 1px solid var(--line); background: var(--surface-2); color: var(--ok); border-radius: 999px; padding: 6px 11px; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; min-height: 44px; }
  .net .d { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .net.off { color: var(--warn); background: var(--warn-bg); border-color: transparent; }

  .screen { flex: 1; overflow-y: auto; padding: 16px 16px 28px; display: flex; flex-direction: column; gap: 14px; }
  .screen > * { flex-shrink: 0; }

  .tabbar { flex-shrink: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--surface); border-top: 1px solid var(--line); padding: 6px 6px calc(8px + env(safe-area-inset-bottom, 0px)); }
  .tabbar button { border: 0; background: transparent; color: var(--faint); display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 4px; min-height: 54px; border-radius: 12px; cursor: pointer; font-size: 11.5px; font-weight: 700; position: relative; }
  .tabbar button[aria-current="page"] { color: var(--primary-strong); background: var(--primary-tint); }
  .tabbar .badge { position: absolute; top: 5px; right: calc(50% - 20px); min-width: 17px; height: 17px; border-radius: 9px; background: #A3461A; color: #fff; font-size: 11px; display: grid; place-items: center; padding: 0 4px; }

  .hello { display: flex; flex-direction: column; gap: 2px; padding: 2px 2px 0; }
  .hello h1 { font-size: 23px; }
  .hello span { font-size: 13px; color: var(--muted); font-weight: 600; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .card-pad { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .label { font-size: 11px; font-weight: 800; letter-spacing: .9px; text-transform: uppercase; color: var(--faint); }
  .hero { background: var(--ink); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 10px; color: #fff; }
  .hero .label { color: #83A791; }
  .hero h2 { font-size: 24px; color: #fff; }
  .hero .meta { font-size: 13.5px; color: #B6CCC0; font-weight: 600; line-height: 1.45; }

  .btn { min-height: 50px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font-size: 15px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 16px; width: 100%; }
  .btn-primary { background: var(--primary-strong); border-color: var(--primary-strong); color: var(--on-primary); }
  .btn-sm { min-height: 44px; width: auto; font-size: 13px; border-radius: 11px; padding: 0 13px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  .row { display: flex; align-items: center; gap: 12px; }
  .li { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line-soft); min-height: 62px; }
  .li:first-child { border-top: 0; }
  .av { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-size: 12.5px; font-weight: 700; flex-shrink: 0; background: var(--surface-2); color: var(--muted); }
  .av.on { background: var(--primary-tint); color: var(--ok); }
  .t { font-size: 15px; font-weight: 700; display: block; }
  .s { font-size: 12.5px; color: var(--muted); font-weight: 600; display: block; margin-top: 2px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
  .c-ok { background: var(--ok-bg); color: var(--ok); } .c-warn { background: var(--warn-bg); color: var(--warn); }
  .c-crit { background: var(--crit-bg); color: var(--crit); } .c-info { background: var(--info-bg); color: var(--info); }
  .c-neutral { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }

  .tick { width: 44px; height: 44px; border-radius: 14px; border: 1.5px solid var(--control); background: var(--surface); display: grid; place-items: center; flex-shrink: 0; cursor: pointer; }
  .tick[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); }
  .bar { height: 7px; border-radius: 4px; background: var(--line); overflow: hidden; display: block; }
  .bar > span { display: block; height: 100%; border-radius: 4px; background: var(--primary); }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer; }
  .pill[aria-pressed="true"] { background: var(--sel); color: var(--on-sel); border-color: var(--sel); }
  textarea { width: 100%; min-height: 84px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); padding: 12px; font: inherit; font-size: 14px; color: var(--text); resize: vertical; }

  .note { font-size: 12.5px; color: var(--faint); font-weight: 600; line-height: 1.5; }
  .warnbox { background: var(--warn-bg); color: var(--warn); border-radius: 14px; padding: 12px 14px; font-size: 13px; font-weight: 600; line-height: 1.45; }
  .leer { padding: 36px 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
  .leer .ic { width: 60px; height: 60px; border-radius: 16px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; color: var(--faint); }
  .leer .ic.gut { background: var(--ok-bg); border-color: transparent; color: var(--ok); }
  .leer h2 { font-size: 19px; }
  .leer p { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.55; max-width: 320px; }

  .offline { background: var(--warn-bg); color: var(--warn); border-radius: 14px; padding: 10px 14px; font-size: 12.5px; font-weight: 700; line-height: 1.45; display: flex; gap: 10px; align-items: center; }
  .offline .d { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  @media (max-width: 359px) {
    .screen { padding-inline: 12px; }
    .li { padding: 11px 12px; gap: 10px; }
    .tick { width: 44px; height: 44px; }
    .stickybar { margin-inline: -12px; padding-inline: 12px; }
  }
  .chip-btn { border: 0; cursor: pointer; font-family: inherit; min-height: 44px; padding: 0 14px; }
  .chip svg { flex-shrink: 0; }
  .erfasst { margin: 0; font-size: 12.5px; font-weight: 700; color: var(--muted); display: flex; gap: 7px; align-items: flex-start; line-height: 1.45; }
  .erfasst svg { flex-shrink: 0; margin-top: 1px; }
  .erfasst.ok { color: var(--ok); }
  .erfasst.warn { color: var(--warn); }
  .einw { display: flex; flex-direction: column; gap: 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .einw .p { display: flex; gap: 11px; align-items: flex-start; font-size: 13.5px; line-height: 1.45; font-weight: 600; color: var(--text); }
  .einw .p svg { flex-shrink: 0; color: var(--primary-strong); margin-top: 1px; }
  .nw { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .nw div { display: flex; justify-content: space-between; gap: 14px; padding: 10px 13px; border-top: 1px solid var(--line-soft); font-size: 13px; }
  .nw div:first-child { border-top: 0; }
  .nw span { color: var(--muted); font-weight: 600; flex-shrink: 0; }
  .nw b { text-align: right; font-weight: 700; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .4px; }
  .stickybar { position: sticky; bottom: -28px; margin: 0 -16px -28px; padding: 12px 16px 16px; background: linear-gradient(to bottom, transparent, var(--ground) 22%); display: flex; flex-direction: column; gap: 8px; }

  .sheet-back { position: absolute; inset: 0; background: rgba(8,20,14,.5); z-index: 40; display: flex; align-items: flex-end; }
  .sheet { width: 100%; background: var(--surface); border-radius: 16px 16px 0 0; padding: 10px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; max-height: 92%; overflow-y: auto; }
  .grip { width: 40px; height: 5px; border-radius: 3px; background: var(--line); align-self: center; margin-bottom: 4px; }
  canvas { width: 100%; height: 200px; border: 1.5px dashed var(--line); border-radius: 16px; background: var(--surface-2); touch-action: none; display: block; }
  .check-row { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 4px; font-size: 14.5px; font-weight: 600; }
  .check-row input { width: 22px; height: 22px; accent-color: #0A7C46; }

  .days { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
  .day { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 8px 0 9px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; min-height: 68px; color: var(--text); }
  .day .w { font-size: 11px; font-weight: 800; color: var(--faint); text-transform: uppercase; letter-spacing: .6px; }
  .day .n { font-family: 'Sora', sans-serif; font-size: 18px; font-weight: 700; }
  .day .dots { display: flex; gap: 3px; height: 6px; align-items: center; }
  .day .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--primary); display: block; }
  .day.heute .w { color: var(--primary-strong); }
  .day[aria-pressed="true"] { background: var(--sel); border-color: var(--sel); }
  .day[aria-pressed="true"] .w { color: var(--sel-soft); }
  .day[aria-pressed="true"] .n { color: var(--on-sel); }
  .day[aria-pressed="true"] .dots i { background: var(--sel-dot); }
  .slot { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 0; border-top: 1px solid var(--line-soft); background: transparent; text-align: left; cursor: pointer; font: inherit; color: inherit; min-height: 70px; }
  .slot:first-child { border-top: 0; }
  .slot:hover { background: var(--surface-2); }
  .zeit { width: 58px; flex-shrink: 0; border-radius: 12px; background: var(--surface-2); padding: 7px 0; display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .zeit b { font-family: 'Sora', sans-serif; font-size: 15px; font-weight: 700; }
  .zeit span { font-size: 11px; color: var(--faint); font-weight: 700; }
  .sum { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .sum div { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 11px 12px; display: flex; flex-direction: column; gap: 2px; }
  .sum b { font-family: 'Sora', sans-serif; font-size: 20px; font-weight: 700; }
  .sum span { font-size: 11.5px; color: var(--muted); font-weight: 600; }

  .profil { background: var(--ink); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 16px; color: #fff; }
  .profil .kopf { display: flex; align-items: center; gap: 13px; }
  .profil .pav { width: 52px; height: 52px; border-radius: 16px; background: rgba(255,255,255,.1); color: #fff; display: grid; place-items: center; font-family: 'Sora', sans-serif; font-size: 17px; font-weight: 700; flex-shrink: 0; }
  .profil h1 { font-size: 20px; color: #fff; }
  .profil .sub { font-size: 12.5px; color: #B6CCC0; font-weight: 600; display: block; margin-top: 3px; }
  .lizenz { display: flex; align-items: center; gap: 16px; background: rgba(255,255,255,.06); border-radius: 16px; padding: 14px; }
  .ring { width: 88px; height: 88px; position: relative; flex-shrink: 0; }
  .ring svg { position: absolute; inset: 0; }
  .ring .mitte { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring b { font-family: 'Sora', sans-serif; font-size: 24px; font-weight: 700; color: #fff; line-height: 1; }
  .ring small { font-size: 11px; color: #B6CCC0; font-weight: 700; margin-top: 3px; white-space: nowrap; }
  .lz-t { font-size: 15px; font-weight: 700; color: #fff; display: block; }
  .lz-s { font-size: 12.5px; color: #B6CCC0; font-weight: 600; display: block; margin-top: 3px; line-height: 1.4; }
  .lz-ok { display: inline-flex; align-items: center; gap: 6px; margin-top: 9px; padding: 4px 10px; border-radius: 999px; background: rgba(111,199,154,.16); color: #8FE0B5; font-size: 11.5px; font-weight: 700; }
  .segs { display: grid; grid-template-columns: repeat(15, minmax(0, 1fr)); gap: 3px; }
  .segs i { height: 14px; border-radius: 4px; background: var(--line); display: block; }
  .segs i.p { background: var(--primary); }
  .segs i.o { background: #5FB6A8; }
  .legende { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; font-weight: 600; color: var(--muted); }
  .legende span { display: inline-flex; align-items: center; gap: 6px; }
  .legende i { width: 9px; height: 9px; border-radius: 3px; display: block; }
  .kurz { font-size: 13.5px; font-weight: 600; line-height: 1.5; color: var(--text); margin: 0; }
  .nachweis { display: flex; align-items: flex-start; gap: 12px; padding: 13px 16px; border-top: 1px solid var(--line-soft); }
  .nachweis:first-child { border-top: 0; }
  .nachweis .dot { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; flex-shrink: 0; }
  .sect { font-size: 12px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase; color: var(--faint); padding: 6px 4px 0; }

  .toast { position: absolute; left: 16px; right: 16px; bottom: 84px; background: var(--ink); color: #fff; padding: 13px 16px; border-radius: 14px; font-size: 13.5px; font-weight: 600; z-index: 60; box-shadow: 0 12px 30px rgba(8,20,14,.35); }
  @media (prefers-reduced-motion: no-preference) {
    .toast { animation: up .18s ease-out; }
    .sheet { animation: sheet .22s ease-out; }
    @keyframes up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes sheet { from { transform: translateY(40px); opacity: .6; } to { transform: none; opacity: 1; } }
  }
  .segment { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; }
  .segment button { min-height: 44px; border: 0; border-radius: 11px; background: transparent; color: var(--muted); font: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer; }
  .segment button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(14,42,29,.12); }
  .sync { font-size: 12.5px; font-weight: 700; color: var(--ok); display: flex; align-items: center; gap: 7px; padding: 0 2px; }
  .sync .d { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  .sync.off { color: var(--warn); }
  .suchfeld { width: 100%; height: 50px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); padding: 0 14px; font: inherit; font-size: 15px; color: var(--text); }
  :root[data-kontrast="stark"] {
    --text: #0B130F; --muted: #33413A; --faint: #33413A; --line: #7D8B82; --line-soft: #B9C4BD; --control: #4D5C53;
    --primary: #005A2F; --primary-strong: #05562F; --ok: #0F4A2C; --warn: #5C3108; --crit: #7E2314; --info: #133F57;
  }
  @media (prefers-color-scheme: dark) {
    :root[data-kontrast="stark"]:not([data-theme="light"]) {
      --text: #FFFFFF; --muted: #D3E1D8; --faint: #C4D4CA; --line: #6A8777; --line-soft: #3F5A4B; --control: #A9C2B4;
      --primary: #5ED897; --primary-strong: #8BE8B5; --on-primary: #05170E; --ok: #A6F2C9; --warn: #F6D5AC; --crit: #FAC9BF; --info: #C3E2F3;
    }
  }
  :root[data-kontrast="stark"][data-theme="dark"] {
    --text: #FFFFFF; --muted: #D3E1D8; --faint: #C4D4CA; --line: #6A8777; --line-soft: #3F5A4B; --control: #A9C2B4;
    --primary: #5ED897; --primary-strong: #8BE8B5; --on-primary: #05170E; --ok: #A6F2C9; --warn: #F6D5AC; --crit: #FAC9BF; --info: #C3E2F3;
  }
  :root[data-kontrast="stark"] .hero .label { color: #C9DBD1; }
  :root[data-kontrast="stark"] .hero .meta, :root[data-kontrast="stark"] .lz-s, :root[data-kontrast="stark"] .profil .sub { color: #D8E6DE; }
  .tn-hinweis { display: flex; gap: 6px; align-items: flex-start; color: var(--info); font-weight: 700; line-height: 1.45; margin-top: 4px; }
  .tn-hinweis svg { flex-shrink: 0; margin-top: 1px; }
  .tn-sperre { display: flex; gap: 6px; align-items: flex-start; margin-top: 4px; line-height: 1.45; }
  .tn-sperre svg { flex-shrink: 0; margin-top: 1px; }
  .a-li { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 16px; border: 0; border-top: 1px solid var(--line-soft); background: transparent; text-align: left; cursor: pointer; font: inherit; color: inherit; min-height: 62px; }
  .a-li:first-child { border-top: 0; }
  .a-li:hover { background: var(--surface-2); }

      aFbStornoOk(id, neu);
      var frei = neu.plaetze - neu.gebucht > 0;
      state.appFb[neu.id] = { am: HEUTE, warte: !frei, statt: f.titel };
      if (frei) neu.gebucht++; else neu.warte = (neu.warte || 0) + 1;
      state.appFbWahl = null; zu(); render();
      toast('Umgebucht auf ' + neu.titel + ' am ' + neu.datum + (aVgl(HEUTE, f.schluss) <= 0 ? ', kostenfrei' : '') + '. Die ' + neu.le + ' LE zählen nach der Teilnahme');
    }
    else if (a === 'app-fb-kollegin') { f = aLehrgang(id); zu(); toast('Die Geschäftsstelle fragt eine Kollegin für ' + f.titel + ' am ' + f.datum + '. Bis sie umgebucht hat, bleibt der Platz bei dir'); }
    else if (a === 'app-ansicht') {
      state.appAnsicht[el.getAttribute('data-k')] = el.getAttribute('data-v');
      aAnsichtAnwenden();
      try { localStorage.setItem(aAnsichtSchluessel, JSON.stringify(state.appAnsicht)); } catch (e) {  }
      render();
      toast(el.getAttribute('data-k') === 'kontrast' ? (state.appAnsicht.kontrast === 'stark' ? 'Starker Kontrast an' : 'Normaler Kontrast') : 'Farbe: ' + el.textContent);
    }
  });

  aWocheNeu();
  aGastListe();

  render();
})();
document.documentElement.setAttribute('lang', 'de');
</script>
